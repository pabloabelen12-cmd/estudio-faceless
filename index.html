<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio Faceless</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a100e">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estudio Faceless">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27%232ee59d%27/%3E%3Cpath d=%27M9 21l5-6 4 3 6-8%27 fill=%27none%27 stroke=%27%2304140d%27 stroke-width=%272.6%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: estudio de producción nocturno, preciso y con energía; nada infantil.
   IDEA: una consola de edición: cada sección es una sala del estudio con su propia luz.
   PICTURE: el lienzo 9:16 en vivo con los personajes animados es la imagen principal.
   COLOUR and TYPE: fondo oscuro; Finanzas = verde dinero, Gym = coral; Archivo ancho para títulos, Inter Tight para texto.
   LAYOUT: menú lateral por sección + selector de estudio arriba; en celular, barra superior y menú desplegable. */
:root{color-scheme:dark;
  --bg:#0a100e;--bg2:#0f1714;--panel:#131d19;--panel2:#18241f;--line:#24332c;--ink:#e9f2ed;--mute:#93a69c;--dim:#61756a;
  --acc:#2ee59d;--acc2:#16b97a;--accInk:#04140d;--warn:#ffc857;--bad:#ff5d6c;--ok:#2ee59d;--info:#6cb8ff;
  --r:14px;--side:256px;font-synthesis:none}
body[data-studio=gym]{--bg:#110c0b;--bg2:#171110;--panel:#1d1514;--panel2:#241a18;--line:#3a2a26;--ink:#f6ece8;--mute:#b39d95;--dim:#7d6760;
  --acc:#ff7a45;--acc2:#e85a24;--accInk:#1a0700}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;transition:background .35s}
h1,h2,h3,h4{font-family:Archivo,"Inter Tight",system-ui,sans-serif;font-stretch:112%;line-height:1.08;margin:0 0 .4em;text-wrap:balance}
h1{font-size:clamp(28px,3.4vw,40px);font-weight:800}
h2{font-size:22px;font-weight:750}
h3{font-size:17px;font-weight:700}
p{margin:.2em 0 .8em}
a{color:var(--acc)}
small,.small{font-size:13px;color:var(--mute)}
.mute{color:var(--mute)}
code{font-size:13px;background:var(--panel2);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px;gap:10px;transition:background .35s}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 2px}
.brand b{font-family:Archivo,"Inter Tight",system-ui,sans-serif;font-stretch:120%;font-weight:850;font-size:17px;letter-spacing:.01em}
.brand svg{flex:none}
.switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:5px}
.switch button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 6px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mute);min-height:44px;text-align:center}
.switch button[data-on]{background:var(--acc);color:var(--accInk)}
.switch button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.switch button:not([data-on]):hover{color:var(--ink);background:var(--panel)}
.navlbl{font-size:12px;color:var(--dim);padding:8px 10px 2px;font-weight:600}
nav.menu{display:flex;flex-direction:column;gap:2px}
nav.menu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:550;font-size:15px;min-height:40px}
nav.menu a:hover{background:var(--panel);color:var(--ink)}
nav.menu a[aria-current]{background:var(--panel2);color:var(--ink);box-shadow:inset 3px 0 0 var(--acc)}
nav.menu a svg{flex:none;opacity:.85}
nav.menu .n{margin-left:auto;font-size:12px;color:var(--dim)}
.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px;font-size:13px}
.svc{display:flex;align-items:center;gap:8px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.zero{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;color:var(--ink);text-decoration:none}
.zero span{font-family:Archivo,"Inter Tight",system-ui,sans-serif;font-stretch:115%;color:var(--acc)}
main{padding:clamp(18px,3vw,36px) clamp(16px,3vw,40px) 80px;max-width:1320px;width:100%}
.top{display:none}
.viewhead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}
.viewhead p{color:var(--mute);margin:0;max-width:70ch}
.crumb{font-size:13px;color:var(--acc);font-weight:700;margin-bottom:6px}

/* ---------- components ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{background:transparent}
.card h3{margin-bottom:.5em}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.sep{height:1px;background:var(--line);margin:16px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:600 15px/1 "Inter Tight",sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-weight:750}
.btn.primary:hover{background:var(--acc2);border-color:var(--acc2)}
.btn.big{min-height:56px;font-size:17px;padding:0 24px;font-family:Archivo,"Inter Tight",system-ui,sans-serif;font-stretch:112%;font-weight:800;letter-spacing:.01em}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
label.f{display:grid;gap:6px;font-size:14px;color:var(--mute);font-weight:550}
input,textarea,select{width:100%;font:16px/1.45 "Inter Tight",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px}
textarea{resize:vertical;min-height:90px}
input[type=color]{padding:4px;height:44px}
input[type=range]{padding:0;accent-color:var(--acc)}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font:600 13px "Inter Tight",system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.tag.ok{background:rgba(46,229,157,.14);color:#5ff0b3}
.tag.warn{background:rgba(255,200,87,.14);color:var(--warn)}
.tag.bad{background:rgba(255,93,108,.14);color:#ff8792}
.tag.info{background:rgba(108,184,255,.14);color:var(--info)}
.tag.acc{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.kpi{display:grid;gap:2px}
.kpi b{font-family:Archivo,"Inter Tight",system-ui,sans-serif;font-stretch:118%;font-size:30px;font-weight:850;line-height:1}
.kpi span{font-size:13px;color:var(--mute)}
.note{border-left:3px solid var(--warn);background:rgba(255,200,87,.07);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px;color:var(--ink)}
.note.info{border-color:var(--info);background:rgba(108,184,255,.07)}
.note.bad{border-color:var(--bad);background:rgba(255,93,108,.07)}
.note.ok{border-color:var(--ok);background:rgba(46,229,157,.07)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--mute)}
.list{display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.item .grow{flex:1}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:13px}
td.num,th.num{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.steps button{all:unset;cursor:pointer;flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--mute);font-size:14px;font-weight:600;min-height:40px}
.steps button i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:12px}
.steps button[data-done] i{background:var(--acc);color:var(--accInk)}
.steps button[aria-current]{border-color:var(--acc);color:var(--ink)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,380px);gap:18px;align-items:start}
.canvasbox{background:#000;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--line)}
.canvasbox canvas{display:block;width:100%;height:auto}
.vert{max-width:360px;margin-inline:auto}
.hero2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.prop{cursor:pointer;transition:border-color .2s,transform .2s}
.prop:hover{border-color:var(--acc)}
.prop[aria-selected=true]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.scene{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:start}
.scene canvas{width:110px;border-radius:8px;background:#000}
.pill{font-size:12px;color:var(--mute)}
.toastbox{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:60;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--acc);padding:12px 14px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:14px}
.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal>.card{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--bg2)}
.score{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.score b{color:var(--ink);text-align:right}
.ficha dt{font-size:13px;color:var(--acc);font-weight:700;margin-top:12px}
.ficha dd{margin:2px 0 0}
.ficha ul{margin:4px 0;padding-left:20px}
.ai{font-size:12px;color:var(--info)}
.hide{display:none!important}
details summary{cursor:pointer;color:var(--mute);font-weight:600}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{grid-template-columns:1fr}}
@media(max-width:900px){
  .hero2{grid-template-columns:1fr}
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .25s;box-shadow:20px 0 40px rgba(0,0,0,.5)}
  body[data-menu] .side{transform:none}
  .top{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line)}
  .top .switch{flex:1}
  .menubtn{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line)}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}.scene{grid-template-columns:80px minmax(0,1fr)}.scene canvas{width:80px}main{padding-top:14px}
  table{font-size:13px}.stack-t thead{display:none}.stack-t tr{display:grid;padding-block:8px}.stack-t td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em}.stack-t td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mv{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}.mvside{position:sticky;top:16px}.mvh{display:flex;gap:12px;align-items:flex-start}.mvh h3{margin:0}.mvn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--accInk);display:grid;place-items:center;font-weight:800}
@media(max-width:900px){.mv{grid-template-columns:minmax(0,1fr)}.mvside{position:static}}
</style>
</head>
<body data-studio="fin">
<div class="top">
  <button class="menubtn" id="menuBtn" aria-label="Abrir menú"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="switch" data-switch></div>
</div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="var(--acc)"/><path d="M9 21l5-6 4 3 6-8" fill="none" stroke="var(--accInk)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>Estudio Faceless</b>
    </div>
    <div class="switch" data-switch></div>
    <nav class="menu" id="nav" aria-label="Secciones"></nav>
    <div class="sidefoot">
      <a class="zero" href="#" id="zeroLink">Gasto acumulado <span>RD$0.00</span></a>
      <div class="svc"><i class="dot" id="dotAI"></i><span id="lblAI">IA: comprobando…</span></div>
      <div class="svc"><i class="dot" id="dotDB"></i><span id="lblDB">Nube: comprobando…</span></div>
      <div class="svc"><i class="dot" id="dotTTS"></i><span id="lblTTS">Voces: comprobando…</span></div>
    </div>
  </aside>
  <main id="main"><div class="empty">Cargando el estudio…</div></main>
</div>
<div class="toastbox" id="toasts" aria-live="polite"></div>
